# Ask4Mo — self-contained LOCAL Docker stack.
#
#   web  Next.js 15 UI      → http://localhost:18093          (container :3000)
#   api  FastAPI (uvicorn)  → http://localhost:18094/api/v1   (container :8000)
#   db   PostgreSQL 16      → internal only (not published; no host port needed)
#   migrate  one-shot `alembic upgrade head` (runs once, before api starts)
#
# Build context is the repo ROOT so src/, migrations/ and frontend/ are visible.
# Reuses the production-grade deploy/Dockerfile.api and deploy/Dockerfile.web.
#
# Quick start (from the repo root):
#   OPENROUTER_API_KEY=sk-... docker compose up -d --build     # full LLM features
#   docker compose up -d --build                               # UI works; LLM actions need a key
#   → open http://localhost:18093
#
# The key can also live in a root `.env` file (compose reads it for substitution):
#   OPENROUTER_API_KEY=sk-...
#
# Notes:
#   - NEXT_PUBLIC_API_BASE_URL is baked into the browser bundle at BUILD time; it
#     must be the host-reachable API URL (http://localhost:18094/api/v1).
#   - FRONTEND_ORIGINS is the exact CORS allow-list (port 18093), per the API's
#     never-wildcard-with-credentials policy.
#   - PostgreSQL doubles as the durable LangGraph checkpoint store; the saver
#     creates and owns its own tables (separate from the Alembic schema).
#   - Ports 18093 (web) and 18094 (api) are used; 18095–18099 remain free
#     (e.g. for an optional Redis at 18095 via RATE_LIMIT_BACKEND=redis).
#   - Data persists in named volumes: `docker compose down -v` wipes everything.

name: ask4mo-local

services:
  # --------------------------------------------------------------------------
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ask4mo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ask4mo}
      POSTGRES_DB: ${POSTGRES_DB:-ask4mo}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ask4mo} -d ${POSTGRES_DB:-ask4mo}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    expose:
      - "5432"

  # --------------------------------------------------------------------------
  # One-shot migration step: applies `alembic upgrade head` exactly once per
  # deploy, BEFORE the api starts (never auto-migrate per replica). Reads
  # DATABASE_URL from the environment (migrations/env.py).
  migrate:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ask4mo}:${POSTGRES_PASSWORD:-ask4mo}@db:5432/${POSTGRES_DB:-ask4mo}
    command: ["alembic", "upgrade", "head"]

  # --------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      API_ENV: development
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ask4mo}:${POSTGRES_PASSWORD:-ask4mo}@db:5432/${POSTGRES_DB:-ask4mo}
      # Durable LangGraph HITL checkpoints (Postgres saver; owns its own tables).
      AGENT_CHECKPOINT_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ask4mo}:${POSTGRES_PASSWORD:-ask4mo}@db:5432/${POSTGRES_DB:-ask4mo}
      # Private candidate document storage (named volume, never a public bucket).
      DOCUMENT_STORAGE_DIR: /data/documents
      # Exact CORS allow-list — the host origins the browser uses.
      FRONTEND_ORIGINS: http://localhost:18093,http://127.0.0.1:18093
      # Mo agent coach (LLM-backed features need OPENROUTER_API_KEY; empty = graceful degrade).
      AGENT_COACH_ENABLED: "true"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes:
      - documents:/data/documents
    ports:
      - "18094:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # --------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args:
        # Baked into the browser bundle at build time — host-reachable API URL.
        NEXT_PUBLIC_API_BASE_URL: http://localhost:18094/api/v1
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:18094/api/v1
    ports:
      - "18093:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  db-data:
  documents:
