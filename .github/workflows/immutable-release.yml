name: Immutable local release regression
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-images:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
        env:
          POSTGRES_USER: disposable
          POSTGRES_PASSWORD: synthetic-test-only
          POSTGRES_DB: p5b_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U disposable -d p5b_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e '.[dev,db]'
      - name: Build exactly one API image and matching web image from this commit
        run: |
          python scripts/release_images.py build --sha "$(git rev-parse HEAD)" \
            --api-base-url https://api.staging.example.com/api/v1 --out "$RUNNER_TEMP/ask4mo-release"
      - name: Real image identity, Compose, migration, durable controls and offline transfer
        env:
          RUN_RELEASE_IMAGE_TESTS: '1'
        run: |
          RELEASE_TEST_BUNDLE="$RUNNER_TEMP/ask4mo-release" RELEASE_TEST_SHA="$(git rev-parse HEAD)" \
            python -m pytest -q -o addopts='' -p no:cacheprovider tests/test_release_images_docker.py
      - name: Build and verify isolated PG16 recovery runner from the exact API image
        run: |
          python scripts/release_images.py build-recovery --manifest "$RUNNER_TEMP/ask4mo-release/release.json" \
            --expected-sha "$(git rev-parse HEAD)" --manifest-sha256 "$(cat "$RUNNER_TEMP/ask4mo-release/release.sha256")" \
            --out "$RUNNER_TEMP/ask4mo-recovery"
          python scripts/release_images.py verify-recovery --manifest "$RUNNER_TEMP/ask4mo-release/release.json" \
            --expected-sha "$(git rev-parse HEAD)" --manifest-sha256 "$(cat "$RUNNER_TEMP/ask4mo-release/release.sha256")" \
            --runner "$RUNNER_TEMP/ask4mo-recovery/recovery.json" --runner-sha256 "$(cat "$RUNNER_TEMP/ask4mo-recovery/recovery.sha256")"
      - name: Real recovery runner Compose resolution and source/dependency identity
        env:
          RUN_RECOVERY_IMAGE_TESTS: '1'
          RELEASE_TEST_BUNDLE: ${{ runner.temp }}/ask4mo-release
          RECOVERY_TEST_BUNDLE: ${{ runner.temp }}/ask4mo-recovery
          P5B_PG_ADMIN_URL: postgresql+psycopg://disposable:synthetic-test-only@127.0.0.1:5432/p5b_test
        run: python -m pytest -q -o addopts='' -p no:cacheprovider tests/test_recovery_operator.py
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install CSP browser tooling
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Built-image before/after enforced CSP and real synthetic sign-in
        run: |
          python scripts/csp/qualify.py --execute-disposable \
            --manifest "$RUNNER_TEMP/ask4mo-release/release.json" \
            --anchor "$(cat "$RUNNER_TEMP/ask4mo-release/release.sha256")" \
            --sha "$(git rev-parse HEAD)" --out "$RUNNER_TEMP/ask4mo-csp"
      - name: Upload safe CSP evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: csp-hydration-evidence
          path: |
            ${{ runner.temp }}/ask4mo-csp/summary.json
            ${{ runner.temp }}/ask4mo-csp/browser-before.json
            ${{ runner.temp }}/ask4mo-csp/browser-after.json
          if-no-files-found: warn
      - name: Upload candidate metadata only (no image publication)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-release-metadata
          path: |
            ${{ runner.temp }}/ask4mo-release/release.json
            ${{ runner.temp }}/ask4mo-release/release.sha256
            ${{ runner.temp }}/ask4mo-release/*-build.log
            ${{ runner.temp }}/ask4mo-recovery/*.json
            ${{ runner.temp }}/ask4mo-recovery/*.sha256
            ${{ runner.temp }}/ask4mo-recovery/*-build.log
          if-no-files-found: warn
      - name: Working tree must remain clean
        run: test -z "$(git status --porcelain)"
