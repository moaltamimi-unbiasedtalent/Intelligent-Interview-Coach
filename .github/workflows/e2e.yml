name: Browser E2E

# Browser gates. The PRIMARY Sprint 4 gate is the Next.js Playwright suite
# (frontend/e2e), which mocks the API at the network layer and builds/starts Next.js
# itself — no backend and no paid provider calls. The legacy Streamlit smoke is kept
# as a separate, clearly labelled job. Runs on pull requests and on demand.
on:
  pull_request:
  workflow_dispatch:

jobs:
  nextjs-e2e:
    name: Next.js Playwright (primary)
    runs-on: ubuntu-latest
    # The serial suite (workers: 1) grew with each package: 506 tests took 15.3 minutes on this runner, so the previous 20-minute ceiling cancelled the job (not a test failure) once the suite
    # passed about 650 tests. The ceiling is a runaway guard, not a performance budget: tests, retries and per-test timeouts are unchanged. Shard the suite if it keeps growing.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install (reproducible)
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Type-check the focused browser qualification
        run: npx tsc --noEmit -p e2e/tsconfig.history.json
      - name: Repeat history readiness, actual images and security observation (zero retries)
        env:
          CI: "true"
        run: >-
          npm run e2e -- --grep 'Candidate: no page requests|History image:|Candidate readiness observer:' --repeat-each=10 --retries=0 --reporter=line --output="$RUNNER_TEMP/history-qualification"
      - name: Retain sanitized history qualification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: history-readiness-evidence
          path: ${{ runner.temp }}/history-qualification/**/*.json
          if-no-files-found: error
      - name: Run Playwright (Playwright builds + starts Next.js)
        env:
          CI: "true"
        run: npm run e2e
      # Diagnostic only: preserve the failure trace (network/console/DOM/navigation) so a
      # CI-only failure that does not reproduce locally can be root-caused from evidence.
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 14
          if-no-files-found: ignore

  legacy-streamlit-smoke:
    name: Legacy Streamlit smoke
    # Legacy Sprint 3 browser smoke over the Streamlit app (Live OFF/ON). Retained as
    # a separate, non-primary job; the candidate product is the Next.js app above.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the app
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install E2E deps (reproducible)
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run Playwright smoke (Playwright starts the app)
        working-directory: e2e
        env:
          CI: "true"
        run: npm test

  connected-admin-users:
    name: Connected Admin user lifecycle (synthetic)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install isolated test dependencies
        run: |
          pip install -e ".[dev]"
          cd frontend
          npm ci
          npx playwright install --with-deps chromium
      - name: Run connected synthetic Admin journey
        env:
          CI: "true"
        run: python scripts/e2e/admin_users_connected.py run

