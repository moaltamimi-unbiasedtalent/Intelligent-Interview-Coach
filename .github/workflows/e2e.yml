name: Browser E2E

# Browser gates. The PRIMARY Sprint 4 gate is the Next.js Playwright suite
# (frontend/e2e), which mocks the API at the network layer and builds/starts Next.js
# itself — no backend and no paid provider calls. The legacy Streamlit smoke is kept
# as a separate, clearly labelled job. Runs on pull requests and on demand.
on:
  pull_request:
  workflow_dispatch:

jobs:
  nextjs-e2e:
    name: Next.js Playwright (primary)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install (reproducible)
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run Playwright (Playwright builds + starts Next.js)
        env:
          CI: "true"
        run: npm run e2e

  legacy-streamlit-smoke:
    name: Legacy Streamlit smoke
    # Legacy Sprint 3 browser smoke over the Streamlit app (Live OFF/ON). Retained as
    # a separate, non-primary job; the candidate product is the Next.js app above.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the app
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install E2E deps (reproducible)
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run Playwright smoke (Playwright starts the app)
        working-directory: e2e
        env:
          CI: "true"
        run: npm test
