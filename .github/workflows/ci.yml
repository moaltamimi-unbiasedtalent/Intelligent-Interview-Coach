name: CI

on:
  push:
    branches: [main, "product/**", "feature/**"]
  pull_request:

jobs:
  # ---------------------------------------------------------------------------------------------------------------------------------------------------------------
  # W12.4F CI hotfix. The original single "python" job ran every cheap static guard AFTER the ~35 minute pytest run. It is now:
  #   static-guards      cheap, dependency-free guards (+ ruff): a documentation or secret failure stops everything within about a minute
  #   python-tests       the SAME backend suite split into 4 deterministic file shards (each test in exactly one shard; see scripts/ci_test_shards.py)
  #   python-evaluators  every deterministic evaluator, migration check and regression guard that the original job ran, unchanged
  #   python             aggregate gate that keeps the REQUIRED CHECK NAME "Python tests & checks": it fails unless every job above succeeded AND the shard test counts
  #                      reconcile with the full-suite collection (a missing, failed or uncollected test fails CI)
  # Failures are never masked (no error-suppression flags or shell fallbacks) and nothing is deselected.
  # ---------------------------------------------------------------------------------------------------------------------------------------------------------------
  static-guards:
    name: Static guards (fast fail)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install ruff only (the static guards below need no project dependencies)
        run: pip install "ruff>=0.6,<1.0"
      - name: Compile
        run: python -m compileall -q app.py src scripts tests
      - name: Ruff (conservative F/E9 rules)
        run: ruff check .
      - name: Product positioning claim guard (P10B-W9.10; offline; claim register, prohibited phrases, no competitor claims)
        run: python scripts/eval_product_positioning.py
      - name: Release acceptance matrix integrity (P10B-W9.13; offline; evidence exists, no blockers, accepted limitations present)
        run: python scripts/eval_release_matrix.py
      - name: Admin design consistency (P10B-W10.0; offline; docs complete, current-vs-planned labels match code, nothing built early)
        run: python scripts/eval_admin_design.py
      - name: Secret scan (fail on real-looking secrets in source)
        run: |
          # Scan SOURCE TEXT only — skip generated bytecode (__pycache__/*.pyc) and any binary
          # so a compiled fixture never trips the scan. All signatures are preserved.
          if grep -rInE \
             --binary-files=without-match \
             --exclude-dir='__pycache__' \
             --exclude='*.pyc' \
             "sk-or-[A-Za-z0-9]{12}|AIza[0-9A-Za-z_-]{30}|-----BEGIN [A-Z ]*PRIVATE KEY-----|(sk|pk)-lf-[A-Za-z0-9]{16}" \
             app.py src scripts; then
            echo "Potential secret found in source"; exit 1
          fi
          echo "No secrets found in source."

  python-tests:
    name: Python tests (shard ${{ matrix.shard }}/4)
    needs: static-guards
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (dev + db + speech + live extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,db,speech,live]"
      - name: Verify the shard plan (every test file in exactly one shard)
        run: python scripts/ci_test_shards.py verify --shards 4
      - name: Pytest shard ${{ matrix.shard }} of 4 (2 workers, file-level distribution; knowledge fixtures, structured retrieval, security, Streamlit smoke)
        run: |
          nproc
          mkdir -p "$RUNNER_TEMP/pytest"
          python -m pytest -n 2 --dist loadfile -p no:cacheprovider --durations=25 --durations-min=2.0 \
            --junitxml="$RUNNER_TEMP/pytest/junit-${{ matrix.shard }}.xml" \
            $(python scripts/ci_test_shards.py list --shards 4 --index ${{ matrix.shard }})
      - name: Summarize shard result
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/pytest/junit-${{ matrix.shard }}.xml" ]; then
            python scripts/ci_test_shards.py summarize --junit "$RUNNER_TEMP/pytest/junit-${{ matrix.shard }}.xml" --shard ${{ matrix.shard }} --out "$RUNNER_TEMP/pytest/shard-${{ matrix.shard }}.json"
          fi
      - name: Upload shard result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-shard-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/pytest/shard-${{ matrix.shard }}.json
            ${{ runner.temp }}/pytest/junit-${{ matrix.shard }}.xml
          if-no-files-found: warn
      - name: Working tree must be clean after tests
        run: |
          # Deterministic qualification must never dirty tracked files (evaluators write to temp dirs by default).
          if [ -n "$(git status --porcelain)" ]; then
            echo "Tracked/untracked changes were produced by tests or evaluators:"; git status --porcelain; exit 1
          fi


  python-evaluators:
    name: Python evaluators and guards
    needs: static-guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (dev + db + speech + live extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,db,speech,live]"
      - name: Import checks (app + key modules)
        run: |
          python -c "import app"
          python -c "import src.career.ui"
          python -c "from src.copilot.service import CareerIntelligenceService"
          python -c "from src.copilot.knowledge.retrieval import build_default_coordinator"
          python -c "from src.copilot.company import build_company_context"
      - name: Source manifest validation
        run: |
          python - <<'PY'
          from src.copilot.knowledge import manifest as km
          entries = km.load_manifest()
          ids = [e.source_id for e in entries]
          assert len(ids) == len(set(ids)), "duplicate source_id"
          groups = {g for g, _ in km.GROUPS}
          for e in entries:
              assert e.group in groups, f"{e.source_id} bad group {e.group}"
              # Licence is never guessed: no licence => flagged for review/manual.
              assert e.licence or e.licence_review_required or e.manual_acquisition_required, \
                  f"{e.source_id} has no licence and is not flagged"
          print(f"Manifest OK: {len(entries)} sources")
          PY
      - name: Collect the full-suite test inventory (reconciled against the shard results)
        run: |
          mkdir -p "$RUNNER_TEMP/inventory"
          python -m pytest --collect-only -q -o addopts="" -p no:cacheprovider > "$RUNNER_TEMP/inventory/collect.txt"
          python - <<'PY'
          import os, re, pathlib
          text = pathlib.Path(os.environ["RUNNER_TEMP"], "inventory", "collect.txt").read_text()
          m = re.search(r"(\d+) tests? collected", text)
          assert m, "could not read the collected-test count"
          pathlib.Path(os.environ["RUNNER_TEMP"], "inventory", "expected.txt").write_text(m.group(1))
          print("collected:", m.group(1))
          PY
      - name: Upload test inventory
        uses: actions/upload-artifact@v4
        with:
          name: pytest-inventory
          path: ${{ runner.temp }}/inventory/expected.txt
          if-no-files-found: error
      - name: Deterministic agent orchestration evaluation (offline; gates, no paid calls)
        run: python scripts/eval_agent.py
      - name: Identity & platform evaluation (Capstone P1/E1; offline; safety invariants = 1.0)
        run: python scripts/eval_identity_platform.py
      - name: Response-experience evaluation (Capstone P2/E2; offline; presentation + preference)
        run: python scripts/eval_response_experience.py
      - name: Dictation-experience evaluation (Capstone P3; offline; input-only invariants)
        run: python scripts/eval_dictation_experience.py
      - name: i18n/l10n evaluation (Capstone P3.5; offline; locale + language/geography safety)
        run: python scripts/eval_i18n_l10n.py
      - name: Documents & evidence evaluation (Capstone P4/E2/E3; offline; privacy + provenance + security)
        run: python scripts/eval_documents_evidence.py
      - name: Multi-agent & model-policy evaluation (Capstone P5/E4; offline; isolation + no-fabrication + injection-inert)
        run: python scripts/eval_multi_agent.py
      - name: Knowledge governance evaluation (Capstone P6/K1-K4; offline; manifest/readiness/abstention/multilingual)
        run: python scripts/eval_knowledge_governance.py
      - name: Prompt Lab evaluation (Capstone P6/E6; offline; isolation + no-auto-promotion + versioning)
        run: python scripts/eval_prompt_lab.py
      - name: Feedback learning evaluation (Capstone P6/E7; offline; taxonomy + lifecycle + no-auto-change)
        run: python scripts/eval_feedback_learning.py
      - name: Retention evaluation (Capstone P6/E7; fixture-only; dry-run/owner-scope/idempotent)
        run: python scripts/eval_retention.py
      - name: Workspace security evaluation (Capstone P6.5; offline; sharing/membership isolation)
        run: python scripts/eval_workspace_security.py
      - name: Platform admin evaluation (Capstone P6.5; offline; authz + metadata boundary + audit)
        run: python scripts/eval_platform_admin.py
      - name: Voice experience evaluation (Capstone P7/E5; offline; TTS/STT invariants + no human-trait inference)
        run: python scripts/eval_voice_experience.py
      - name: Realtime voice evaluation (Capstone P7.5/C1; offline; secret boundary, barge-in, fallback, no audio/trait)
        run: python scripts/eval_realtime_voice.py
      - name: Account deletion evaluation (Capstone P8; offline; cascade + files + checkpoints + isolation + idempotency)
        run: python scripts/eval_account_deletion.py
      - name: Privacy controls evaluation (P10B-W9.8; offline; export scope, owner-scoped deletes, no write retry, honest copy)
        run: python scripts/eval_privacy_controls.py
      - name: Documentation consistency guard (P10B-W9.11; offline; authority semantics, locale vs speech sets, specialists, tool registry, current-state docs)
        run: python scripts/eval_doc_consistency.py
      - name: Engineering-quality guard (P10B-W9.12; offline; test isolation, token opacity, rate-limit boundary, legacy auth removal)
        run: python scripts/eval_engineering_quality.py
      - name: Admin foundation (P10B-W10.1; offline; 43 permissions, every admin route gated, presets, audit fail-closed, provider allowlist schema, no migration)
        run: python scripts/eval_admin_foundation.py
      - name: Admin access (P10B-W10.2; offline; SEC-W10-01 session revocation, request-time inactive check, last-admin guard, code-defined roles, no private-content schema)
        run: python scripts/eval_admin_access.py
      - name: Admin support (P10B-W10.3; offline; internal-note isolation, owner-scoped candidate routes, permissioned admin routes, localized copy, export/deletion contract, no SLA or live claims)
        run: python scripts/eval_admin_support.py
      - name: Admin entitlements (P10B-W10.4; offline; code-defined registry, no invented quota/price/billing, resolver decides access, subject integrity, immutable active plans)
        run: python scripts/eval_admin_entitlements.py
      - name: Admin integrations (P10B-W10.6; offline; code-defined registry, SecretStore with no admin read path, metadata-only responses, manual bounded probes, honest status wording)
        run: python scripts/eval_admin_integrations.py
      - name: Admin jobs (P10B-W10.9; offline; DB-backed queue, separate worker, code-defined job types, SKIP LOCKED + SQLite atomic claims, leases/retries/idempotency, no raw payload to Admin)
        run: python scripts/eval_admin_jobs.py
      - name: Admin knowledge (P10B-W10.8; offline; approval before retrieval, active-only retrieval enforced by the control plane, authority 1/2/3, 7 KB languages, provenance + licence gates, W10.9 jobs, idempotent indexing)
        run: python scripts/eval_admin_knowledge.py
      - name: Admin privacy and legal (P10B-W10.10; offline; durable privacy requests, W9.8 services reused, preparation-run index without scans, versioned legal documents, recorded acceptance without fabricated history)
        run: python scripts/eval_admin_privacy_legal.py
      - name: Admin billing (P10B-W10.5; offline; MOCK BILLING only, production guard, minor-unit money, versioned terms separate from entitlements, second approvers, billing never changes access, idempotent refunds/events)
        run: python scripts/eval_admin_billing.py
      - name: Admin AI and model administration (P10B-W10.7; offline; code-defined catalogue, hash-bound evaluation, distinct second approver, no bypass, staging before production, fail-closed resolver, no-active-config equals code defaults)
        run: python scripts/eval_admin_ai_models.py
      - name: "Admin durable platform pause and feature flags (P10B-W10.11; offline; SEC-W10-05 closure: DB-backed pause, restart/cross-instance, fail-closed admission before any provider, worker not paused, code-defined restriction-only flags, no generic editor)"
        run: python scripts/eval_admin_platform_config.py
      - name: Admin reporting (P10B-W10.12; offline; aggregate-only read-only reports, minimum-cohort suppression, no fabricated metrics, AI usage once and idempotent, unknown cost never zero, commercial permission, MOCK BILLING not revenue)
        run: python scripts/eval_admin_reporting.py
      - name: Admin security, audit and incidents (P10B-W10.13; offline; safe security events, append-only audit at the database, bounded export, incidents with append-only history, in-app alerts, two-person role change with step-up, no break-glass)
        run: python scripts/eval_admin_security.py
      - name: Full Admin qualification (P10B-W10.14; offline; least-privilege role model, 43-permission matrix, every route x persona, no private-data superuser, secret/privacy boundaries, mock-billing truthfulness, no break-glass)
        run: python scripts/eval_admin_qualification.py
      - name: Integrated candidate + Admin guard (P10B-W11; offline; cross-plane separation, support-content exception, language dimensions, slogan, agent architecture, no RC created by W11)
        run: python scripts/eval_w11_integrated.py
      - name: "RC-P10-003 artifact guard (offline; separate owner-approved RC artifact, pinned SHA, matrix 99/88/11/0, RC-P10-002 immutable)"
        run: python scripts/eval_rc_p10_003.py
      - name: Rate-limit evaluation (Capstone P8; offline; auth + cost buckets, window reset, anti-enumeration)
        run: python scripts/eval_rate_limits.py
      - name: Hosting-readiness evaluation (Capstone P8; offline; env/cookies/CORS/headers/pause/malware — does NOT certify EX-12)
        run: python scripts/eval_hosting_readiness.py
      - name: Restart/recovery evaluation (Capstone P9/AC-20; offline; restart + backup/restore on disposable state)
        run: python scripts/eval_restart_recovery.py
      - name: Alembic migration validation (fresh upgrade + downgrade, single head)
        env:
          DATABASE_URL: sqlite:////tmp/ci_migrations.db
        run: |
          alembic upgrade head
          alembic downgrade 0003_interview_sessions
          alembic upgrade head
          test "$(alembic heads | wc -l)" -eq 1
      - name: Knowledge expansion eval smoke
        run: python scripts/eval_knowledge_expansion.py
      - name: Product coverage smoke (offline; no live keys)
        run: |
          python scripts/gen_product_coverage_cases.py
          python scripts/eval_product_coverage.py
      - name: Global evaluation corpus and negative regressions (P10C-G; offline; synthetic fixtures; deterministic; fails on any regression)
        run: python scripts/eval_global_corpus.py --repeat 2 --json "$RUNNER_TEMP/p10c_g_results.json"
      - name: Product coverage regression guard (P10C-G; clean_checkout profile set explicitly; never a pass against the 95% gate; fails on any per-case regression)
        env:
          ASK4MO_COVERAGE_PROFILE: clean_checkout
        run: python scripts/check_product_coverage_baseline.py --json "$RUNNER_TEMP/product_coverage_status.json" --report-md "$RUNNER_TEMP/product_coverage_status.md"
      - name: Knowledge-base requalification (P10D; offline; synthetic fixture; deterministic; scripted responder, no model; fails on any regression)
        run: python scripts/eval_kb_requalification.py --repeat 2 --json "$RUNNER_TEMP/p10d_results.json" --md "$RUNNER_TEMP/p10d_results.md"
      - name: Governed speech providers (W12.4E; offline contract evaluation; fixture engines only; no model, no network; genuine provider execution NOT VERIFIED)
        run: python scripts/eval_speech_providers.py --json "$RUNNER_TEMP/w12_4e_speech.json"
      - name: Upload P10C-G and P10D machine-readable results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p10c-g-results
          path: |
            ${{ runner.temp }}/p10c_g_results.json
            ${{ runner.temp }}/product_coverage_status.json
            ${{ runner.temp }}/product_coverage_status.md
            ${{ runner.temp }}/p10d_results.json
            ${{ runner.temp }}/p10d_results.md
            ${{ runner.temp }}/w12_4e_speech.json
          if-no-files-found: warn
      - name: Working tree must be clean after tests and evaluators
        run: |
          # Deterministic qualification must never dirty tracked files (evaluators write to temp dirs by default).
          if [ -n "$(git status --porcelain)" ]; then
            echo "Tracked/untracked changes were produced by tests or evaluators:"; git status --porcelain; exit 1
          fi


  python-evaluation-extras:
    name: Python evaluation extras (RAGAS adapter)
    needs: static-guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (dev + db + evaluation extras, the versions pinned in pyproject.toml)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,db,evaluation]"
      - name: The optional packages must really be importable here (otherwise the extras test would silently skip)
        run: python -c "import ragas, langchain_openai; print('ragas', ragas.__version__)"
      - name: RAGAS adapter, evaluator request bounds and live-budget guard tests (offline; no provider is contacted)
        run: python -m pytest -p no:cacheprovider -q tests/test_ragas_adapter.py tests/test_ragas_ui_runner.py tests/test_demo_live_budget.py -rs

  python:
    name: Python tests & checks
    needs: [static-guards, python-tests, python-evaluators, python-evaluation-extras]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every Python job must have succeeded
        run: |
          echo "static-guards=${{ needs.static-guards.result }} python-tests=${{ needs.python-tests.result }} python-evaluators=${{ needs.python-evaluators.result }} python-evaluation-extras=${{ needs.python-evaluation-extras.result }}"
          test "${{ needs.static-guards.result }}" = "success"
          test "${{ needs.python-tests.result }}" = "success"
          test "${{ needs.python-evaluators.result }}" = "success"
          test "${{ needs.python-evaluation-extras.result }}" = "success"
      - name: Download shard results and the test inventory
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/results
      - name: Reconcile executed tests with the collected inventory (no missing, uncollected or failed test)
        run: |
          python3 scripts/ci_test_shards.py reconcile --shards 4 --expected "$(cat "$RUNNER_TEMP/results/pytest-inventory/expected.txt")" --dir "$RUNNER_TEMP/results"

  frontend:
    name: Frontend tests & build
    # The PRIMARY Sprint 4 frontend is the Next.js app in frontend/.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  legacy-live-component:
    name: Legacy Live component
    # Legacy/experimental Streamlit Live component — kept as a separate, clearly
    # labelled job (not the primary frontend gate). The candidate product is Next.js.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: components/live_interviewer/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
